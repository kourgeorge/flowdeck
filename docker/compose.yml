name: flowdeck

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: flowdeck-backend
    ports:
      - "8002:8002"
    environment:
      # Database
      - DATABASE_URL=sqlite:///./data/flowdeck.db
      
      # API Keys (set these in .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      
      # OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      
      # PayPal (optional)
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      
      # Email (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      
      # Application settings
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3003,http://localhost:80}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - ENABLE_DAILY_SYNC=${ENABLE_DAILY_SYNC:-false}
      - ENABLE_MARKET_OVERVIEW_CACHE_REFRESH=${ENABLE_MARKET_OVERVIEW_CACHE_REFRESH:-true}
      - ENABLE_DIGEST_SCHEDULER=${ENABLE_DIGEST_SCHEDULER:-false}
      
      # Redis (optional, for caching)
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: flowdeck-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: flowdeck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:

networks:
  default:
    name: flowdeck-network

