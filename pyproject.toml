[project]
name = "tradingagents"
version = "0.1.0"
description = "Multi-Agents LLM Financial Trading Framework (Python backend + agents)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Stock-dashboard backend (FastAPI)
    "APScheduler>=3.10.0",
    "fastapi>=0.104.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "scalar-fastapi>=1.8.2",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    # LangChain / LLM
    "chromadb>=1.0.12",
    "sentence-transformers>=3.0.0",
    "langchain-anthropic>=0.3.15",
    "langchain-cerebras>=0.0.6",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.5",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    # Data & markets
    "akshare>=1.16.98",
    "backtrader>=1.9.78.123",
    "eodhd>=1.0.32",
    "finnhub-python>=2.4.23",
    "pandas>=2.3.0",
    "stockstats>=0.6.5",
    "tushare>=1.4.21",
    "yfinance>=0.2.63",
    "yahooquery>=2.4.1",
    # News / social / feeds
    "feedparser>=6.0.11",
    "grip>=4.6.2",
    "parsel>=1.10.0",
    "praw>=7.8.1",
    "requests>=2.32.4",
    "sec2md>=0.1.23",
    # CLI / UX
    "chainlit>=2.5.5",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "tqdm>=4.67.1",
    # Infra
    "pytz>=2025.2",
    "redis>=6.2.0",
    "setuptools>=80.9.0",
    "typing-extensions>=4.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
